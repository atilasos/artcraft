[package]
name = "creative_desk"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
tauri = { version = "2.11.2", optional = true, features = ["protocol-asset"] }

[build-dependencies]
tauri-build = { version = "2.6.2", optional = true }

[dev-dependencies]
tempfile.workspace = true
